<!doctype html>
<meta charset="utf-8">
<title>Covered page</title>
<button id="b" style="position:absolute;left:20px;top:100px;width:200px;height:50px">Covered button</button>
<div style="position:absolute;left:0;top:80px;width:400px;height:100px;background:#ccc">Overlay</div>
<script>
  document.getElementById('b').addEventListener('click', () => { document.title = 'clicked'; });
</script>
