# Browser tests for the Shelf demo shop. Serve the app with ./serve.sh first.
# empty-cart-total is expected to fail: it catches the deliberate bug described in README.md.

- id: nav-to-catalog
  url: http://localhost:3000/index.html
  goal: >-
    On the Shelf home page, open the Catalog page.
    Stop when the list of books is visible.
  tags: [shelf]
  verify: page
  verify_args:
    url: "/catalog\\.html"
    text: ["Catalog", "Showing 12 of 12 books"]

- id: search-book
  url: http://localhost:3000/catalog.html
  goal: >-
    On the catalog page, type The Glass Lighthouse in the Search books box.
    Stop when the catalog shows only The Glass Lighthouse.
  tags: [shelf]
  verify: page
  verify_args:
    url: ["/catalog\\.html", "[?&]q=[^&]*glass lighthouse"]
    text: ["The Glass Lighthouse", "Showing 1 of 12 books"]

- id: filter-category
  url: http://localhost:3000/catalog.html
  goal: >-
    On the catalog page, choose Science in the Category filter.
    Stop when only Science books are listed.
  tags: [shelf]
  verify: page
  verify_args:
    url: ["/catalog\\.html", "[?&]category=science"]
    text: ["The Living Cell", "Showing 4 of 12 books"]
    fields:
      Category: Science

- id: sort-price
  url: http://localhost:3000/catalog.html
  goal: >-
    On the catalog page, choose Price low to high in the Sort by menu.
    Stop when the books are sorted from the cheapest to the most expensive.
  tags: [shelf]
  verify: page
  verify_args:
    url: ["/catalog\\.html", "[?&]sort=price-asc"]
    fields:
      Sort by: Price low to high

- id: open-book-detail
  url: http://localhost:3000/catalog.html
  goal: >-
    On the catalog page, open the detail page of the book The Clockmakers.
    Stop when the page for The Clockmakers is shown.
  tags: [shelf]
  verify: page
  verify_args:
    url: "/book\\.html\\?id=the-clockmakers"
    text: ["The Clockmakers", "Paul Mercier"]

- id: add-to-cart
  url: http://localhost:3000/catalog.html
  goal: >-
    On the catalog page, add the book Winter Orchard to the cart, then open the Cart page.
    Stop when the cart lists Winter Orchard.
  tags: [shelf]
  verify: page
  verify_args:
    url: "/cart\\.html"
    text: ["Winter Orchard", "Total: $"]

- id: contact-form
  url: http://localhost:3000/contact.html
  goal: >-
    On the contact page, enter Ada Lovelace as the name and ada@example.com as the email,
    choose Returns as the topic, and enter Damaged cover as the message. Do not send the form.
    Stop when the name, the email, the topic and the message are set.
  tags: [shelf]
  verify: page
  verify_args:
    url: "/contact\\.html"
    fields:
      Name: Ada Lovelace
      Email: ada@example.com
      Topic: Returns
      Message: Damaged cover

- id: contact-send
  url: http://localhost:3000/contact.html
  goal: >-
    On the contact page, enter Grace Hopper as the name and grace@example.com as the email,
    choose Order as the topic, enter Where is my order as the message, and click Send.
    Stop when a thank you message is shown.
  tags: [shelf]
  verify: page
  verify_args:
    url: "/contact\\.html#sent"
    text: ["Thanks, Grace Hopper. We will reply to grace@example.com."]

- id: help-returns
  url: http://localhost:3000/index.html
  goal: >-
    On the Shelf home page, open the Help page, then follow the Returns policy link.
    Stop when the Returns policy section is shown.
  tags: [shelf]
  verify: page
  verify_args:
    url: "/help\\.html#returns"
    text: ["Returns policy", "within 30 days"]

- id: empty-cart-total
  url: http://localhost:3000/cart.html?seed=1
  goal: >-
    On the cart page, which already holds two books, click Empty cart.
    Stop when the cart says it is empty.
  tags: [shelf]
  verify: page
  verify_args:
    url: "/cart\\.html"
    text: ["Your cart is empty.", "Total: $0.00"]
